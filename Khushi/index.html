<!DOCTYPE html>
<html>
<head>
    <title>Bean Bliss Café</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #3e2723, #6d4c41, #a1887f);
            color: #333;
            overflow-x: hidden;
        }

        /* Floating Coffee Beans Animation */
        .bean {
            position: fixed;
            width: 25px;
            height: 15px;
            background: #4e342e;
            border-radius: 50%;
            opacity: 0.7;
            animation: float 10s linear infinite;
        }

        @keyframes float {
            from {
                transform: translateY(100vh) rotate(0deg);
            }
            to {
                transform: translateY(-10vh) rotate(360deg);
            }
        }

        header {
            background: url('https://images.unsplash.com/photo-1509042239860-f550ce710b93') center/cover no-repeat;
            height: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        header h1 {
            font-size: 50px;
            background: rgba(0,0,0,0.55);
            padding: 15px 30px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
        }

        .section {
            padding: 50px 20px;
            text-align: center;
        }

        .section h2 {
            color: white;
            margin-bottom: 30px;
        }

        .menu {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .card {
            background: rgba(255,255,255,0.9);
            width: 260px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.03);
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .card h3 {
            margin: 10px 0 5px;
        }

        .price {
            font-weight: bold;
            color: #5d4037;
        }

        .btn {
            background: #6d4c41;
            color: white;
            border: none;
            padding: 8px 16px;
            margin-bottom: 15px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #3e2723;
        }

        .about {
            background: rgba(255,255,255,0.9);
            margin: 40px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
        }

        footer {
            background: #2e1b16;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 30px;
        }
    </style>
</head>
<body>

<!-- Floating Beans -->
<script>
for (let i = 0; i < 20; i++) {
    let bean = document.createElement("div");
    bean.className = "bean";
    bean.style.left = Math.random() * window.innerWidth + "px";
    bean.style.animationDuration = (5 + Math.random() * 5) + "s";
    document.body.appendChild(bean);
}
</script>

<header>
    <h1>Bean Bliss Café ☕</h1>
</header>

<div class="section">
    <h2>Our Special Coffees</h2>

    <div class="menu">

        <div class="card">
            <img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085">
            <h3>Cappuccino</h3>
            <p class="price">₹180</p>
            <button class="btn">Order Now</button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1461023058943-07fcbe16d735">
            <h3>Latte</h3>
            <p class="price">₹200</p>
            <button class="btn">Order Now</button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1511920170033-f8396924c348">
            <h3>Mocha</h3>
            <p class="price">₹220</p>
            <button class="btn">Order Now</button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93">
            <h3>Espresso</h3>
            <p class="price">₹120</p>
            <button class="btn">Order Now</button>
        </div>

    </div>
</div>

<div class="about">
    <h2>About Bean Bliss</h2>
    <p>
        Experience the warmth of freshly brewed coffee made from premium roasted beans.
        A cozy place to relax, work, and enjoy the perfect coffee moments.
    </p>
</div>

<footer>
    <p>--Have a nice day</p>
</footer>

</body>
</html>
